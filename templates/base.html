<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>{% block title %}Selling Report Photos{% endblock %}</title>
<style>body{font:15px system-ui,sans-serif;max-width:760px;margin:40px auto;padding:0 16px;color:#222}h1{font-size:22px}
.card{border:1px solid #ddd;border-radius:8px;padding:18px;margin:16px 0}button,.btn{background:#2a5db0;color:#fff;border:0;border-radius:6px;padding:9px 16px;font-size:15px;cursor:pointer;text-decoration:none;display:inline-block}
.err{color:#b00020}.muted{color:#666;font-size:13px}table{border-collapse:collapse;width:100%;font-size:13px}td,th{border-bottom:1px solid #eee;padding:4px 6px;text-align:left}
progress{width:100%;height:18px}</style></head><body>{% block body %}{% endblock %}</body></html>
